[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dart-transformation-scanner"
version = "0.1.0"
description = "OpenDART transformation scanner and experimental investment research tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Daviswhistle" }]
dependencies = [
  "requests>=2.31,<3",
  "pypdf>=6,<7",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[project.scripts]
transformation-scanner = "transformation_scanner.cli:main"
distressed-equity = "distressed_equity.cli:main"
distressed-equity-screen = "distressed_equity.screen_cli:main"
distressed-equity-sec = "distressed_equity.sec_cli:main"
distressed-equity-sec-debt = "distressed_equity.sec_debt_cli:main"
distressed-equity-sec-instruments = "distressed_equity.sec_instrument_cli:main"
distressed-equity-ingest = "distressed_equity.agent_ingest_cli:main"
distressed-equity-covenant = "distressed_equity.covenant_cli:main"
distressed-equity-debt-ledger = "distressed_equity.debt_instrument_cli:main"
distressed-equity-debt-lineage = "distressed_equity.debt_lineage_cli:main"
distressed-equity-bond-market = "distressed_equity.bond_market_cli:main"
distressed-equity-trace-normalize = "distressed_equity.trace_normalize_cli:main"
distressed-equity-credit-replay = "distressed_equity.credit_replay_cli:main"
distressed-equity-walk-forward-priors = "distressed_equity.walk_forward_prior_cli:main"
distressed-equity-prior-calibration = "distressed_equity.prior_calibration_cli:main"
distressed-equity-research = "distressed_equity.orchestration_cli:main"
distressed-equity-multimodal = "distressed_equity.multimodal_cli:main"
distressed-equity-replay = "distressed_equity.replay_cli:main"
distressed-equity-base-rates = "distressed_equity.base_rate_cli:main"

[tool.setuptools.packages.find]
include = ["transformation_scanner*", "research_pipeline*", "distressed_equity*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
