[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dart-transformation-scanner"
version = "0.1.0"
description = "OpenDART-based scanner for listed companies undergoing economic transformation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Daviswhistle" }]
dependencies = [
  "requests>=2.31,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[project.scripts]
transformation-scanner = "transformation_scanner.cli:main"

[tool.setuptools.packages.find]
include = ["transformation_scanner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
