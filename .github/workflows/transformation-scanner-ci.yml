name: research-ci

on:
  push:
    branches:
      - main
    paths:
      - "transformation_scanner/**"
      - "distressed_equity/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/transformation-scanner-ci.yml"
  pull_request:
    paths:
      - "transformation_scanner/**"
      - "distressed_equity/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/transformation-scanner-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Compile packages
        run: python -m compileall -q transformation_scanner distressed_equity
      - name: Run tests
        run: python -m pytest
