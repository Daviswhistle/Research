name: transformation-scanner-ci

on:
  push:
    branches:
      - main
    paths:
      - "transformation_scanner/**"
      - "opportunity_scanner/**"
      - "research_pipeline/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/transformation-scanner-ci.yml"
  pull_request:
    paths:
      - "transformation_scanner/**"
      - "opportunity_scanner/**"
      - "research_pipeline/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/transformation-scanner-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.2"
          python-version: "3.11.9"
      - name: Sync locked environment
        run: uv sync --locked --extra test
      - name: Compile package
        run: uv run --locked --extra test python -m compileall -q transformation_scanner opportunity_scanner research_pipeline
      - name: Run tests
        run: uv run --locked --extra test python -m pytest
